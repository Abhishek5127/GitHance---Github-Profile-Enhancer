<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>404 | GitHance</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Inter, system-ui, -apple-system, sans-serif;
        color: #f8fafc;
        background: radial-gradient(circle at 12% 8%, rgba(255, 122, 26, 0.24), transparent 42%),
          radial-gradient(circle at 85% 0%, rgba(48, 214, 255, 0.18), transparent 40%),
          #0b0d0f;
      }

      .container {
        width: min(1080px, 92vw);
        margin: 0 auto;
      }

      .site-header {
        position: sticky;
        top: 0;
        z-index: 10;
        backdrop-filter: blur(14px);
        background: rgba(11, 13, 15, 0.7);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .header-inner {
        min-height: 76px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        color: #fff;
        font-weight: 700;
        letter-spacing: 0.03em;
      }

      .brand-badge {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: linear-gradient(160deg, rgba(255, 122, 26, 0.34), rgba(48, 214, 255, 0.2));
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
      }

      .nav {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .nav a {
        text-decoration: none;
        color: rgba(255, 255, 255, 0.8);
        font-size: 0.88rem;
        padding: 8px 12px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.03);
      }

      .nav a:hover {
        color: #fff;
        background: rgba(255, 255, 255, 0.08);
      }

      .content {
        padding: 56px 0 72px;
      }

      .card {
        border-radius: 24px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: linear-gradient(180deg, rgba(20, 23, 28, 0.92), rgba(12, 14, 18, 0.96));
        box-shadow: 0 26px 90px rgba(0, 0, 0, 0.35);
        padding: 28px;
      }

      .eyebrow {
        margin: 0;
        font-size: 0.74rem;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: rgba(255, 179, 127, 0.9);
      }

      h1 {
        margin: 10px 0 0;
        font-size: clamp(1.9rem, 4vw, 2.6rem);
        line-height: 1.18;
      }

      p {
        margin: 14px 0 0;
        color: rgba(255, 255, 255, 0.75);
        line-height: 1.55;
      }

      .path {
        margin-top: 20px;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(255, 255, 255, 0.03);
        color: rgba(255, 255, 255, 0.88);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
        overflow-x: auto;
      }

      .actions {
        margin-top: 24px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.9rem;
        padding: 0 16px;
        cursor: pointer;
      }

      .btn-primary {
        color: #000;
        background: #fff;
        border: 1px solid transparent;
      }

      .btn-primary:hover {
        background: rgba(255, 255, 255, 0.9);
      }

      .btn-ghost {
        color: rgba(255, 255, 255, 0.84);
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.16);
      }

      .btn-ghost:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      .footnote {
        margin-top: 18px;
        font-size: 0.82rem;
        color: rgba(255, 255, 255, 0.54);
      }

      @media (max-width: 640px) {
        .header-inner {
          padding: 10px 0;
        }

        .content {
          padding-top: 32px;
        }

        .card {
          padding: 20px;
        }

        .nav {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="/" aria-label="GitHance Home">
          <span class="brand-badge">GH</span>
          <span>GitHance</span>
        </a>
        <nav class="nav" aria-label="Primary">
          <a href="/">Home</a>
          <a href="/product">Product</a>
          <a href="/pricing">Pricing</a>
          <a href="/changelog">Changelog</a>
        </nav>
      </div>
    </header>

    <main class="content">
      <section class="container">
        <article class="card" role="alert" aria-live="polite">
          <p class="eyebrow">404 Not Found</p>
          <h1>This page does not exist.</h1>
          <p>
            The URL you tried is not available. If you typed it manually, check for typos,
            or return to a known page.
          </p>
          <div class="path" id="missing-path">/</div>

          <div class="actions">
            <a class="btn btn-primary" href="/">Go to Home</a>
            <a class="btn btn-ghost" href="/pricing">See Pricing</a>
            <button class="btn btn-ghost" type="button" onclick="history.back()">Go Back</button>
          </div>

          <p class="footnote">Outside-app fallback page served for unknown routes.</p>
        </article>
      </section>
    </main>

    <script>
      (function setMissingPath() {
        var path = window.location.pathname || "/";
        var query = window.location.search || "";
        var hash = window.location.hash || "";
        var fullPath = path + query + hash;
        var target = document.getElementById("missing-path");
        if (target) {
          target.textContent = fullPath;
        }
      })();
    </script>
  </body>
</html>
